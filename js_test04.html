<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나이 확인 사이트</title>
</head>
<body>
    <h1 id="result">나이 확인 프로그램</h1>
    <button onclick="checkAge()">나이 확인</button>

    <!-- 나이를 입력 받아서 성인 여부를 출력하는 사이트 -->
     <script>
        function checkAge() {
            let age = Number(prompt("나이를 입력하세요")); //입력받은 값을 숫자형으로 변환 후에 저장 

            if(age >= 19) {
                document.getElementById("result").textContent = "당신은 성년입니다.";
            } else {
                document.getElementById("result").textContent = "당신은 미성년자입니다.";
            }

            console.log(age);
        }
     </script>
</body>
</html>
