<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/signup.css">    
    <title>회원 가입</title>
</head>
<body>
    <div class="container">
        <h1>회원 가입</h1>

        <form id="signupForm">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="userId" placeholder="영문 소문자와 숫자 4~12자">
                <div class="error" id="userIdError"></div>                
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="password" placeholder="8자 이상 입력">
                <div class="error" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label>비밀번호 확인</label>
                <input type="password" id="passwordCheck" placeholder="비밀번호를 다시 입력하세요">
                <div class="error" id="passwordCheckError"></div>
            </div>

            <div class="form-group">
                <label>이름</label>
                <input type="text" id="name" placeholder="한글 이름 입력">
                <div class="error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label>이메일</label>
                <input type="text" id="email" placeholder="example@email.com">
                <div class="error" id="emailError"></div>
            </div>

            <button type="submit">가입하기</button>
        </form>
    </div>

    <script src="js/signup.js"></script>
    
</body>
</html>
