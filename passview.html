<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 보이기</title>
</head>
<body>
    <h2>로그인</h2>
    아이디 : <input type="text"><br><br>
    비밀번호 : <input type="password" id="password">
    <button id="passbtn" onclick="passview()">비밀번호 보이기</button>

    <script>
       const password = document.getElementById("password");
       const passbtn = document.getElementById("passbtn");

       function passview() {
        if(password.type == "password") {
            password.type = "text";
            passbtn.textContent = "비밀번호 숨기기";
        } else {
            password.type = "password";
            passbtn.textContent = "비밀번호 보이기";
        }

            
       }

    </script>

</body>
</html>
